name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Generate demo data
        run: python -m src.data.generate_data

      - name: Unit tests
        run: pytest tests -v

  model-quality-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data
        run: python -m src.data.generate_data

      - name: Train + evaluate model (fast search for CI)
        run: python -m src.models.train --n-trials 3

      - name: Enforce quality gate
        run: |
          python - <<'EOF'
          import json, sys
          with open("models/latest_metrics.json") as f:
              m = json.load(f)
          if not m["passed_gate"]:
              print(f"Quality gate FAILED: {m['gate_reason']}")
              sys.exit(1)
          print(f"Quality gate PASSED: {m['gate_reason']}")
          EOF

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: churn-model
          path: |
            models/latest_model.joblib
            models/latest_metrics.json
