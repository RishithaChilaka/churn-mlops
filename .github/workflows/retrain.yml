name: Scheduled Monitoring & Self-Retraining

# This is the "self-training" loop: on a schedule, check for data drift,
# retrain + re-evaluate against the quality gate if warranted, and - if the
# retrained model is actually different - commit the new model artifact back
# to the repo. That push triggers Railway's auto-deploy, so the live demo
# picks up the freshly retrained model with no manual steps.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force retraining even without detected drift"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure demo data exists
        run: |
          [ -f data/reference/train.csv ] || python -m src.data.generate_data

      - name: Run drift check + conditional retraining
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python -m src.pipelines.retrain_pipeline $FORCE_FLAG

      - name: Upload drift + retraining reports
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: reports/drift/

      - name: Commit + push retrained model (triggers Railway auto-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- models/; then
            echo "No model changes to commit - retraining was skipped or produced an identical model."
          else
            git add models/
            git commit -m "chore: auto-retrain churn model [scheduled]"
            git push
            echo "Pushed retrained model - Railway will auto-deploy the update."
          fi
