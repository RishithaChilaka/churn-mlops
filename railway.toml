# Railway deployment config for the churn API.
# Railway builds this Dockerfile from the repo root and exposes the app on
# the $PORT it injects at runtime (see docker/Dockerfile.api's CMD, overridden
# below to bind to $PORT instead of the hardcoded 8000 used for local/Docker Compose).
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.api"

[deploy]
startCommand = "sh -c 'uvicorn src.api.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
