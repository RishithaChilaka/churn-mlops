name: Scheduled Monitoring & Retraining

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force retraining even without detected drift"
        type: boolean
        default: false

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure demo data exists
        run: |
          [ -f data/reference/train.csv ] || python -m src.data.generate_data

      - name: Run drift check + conditional retraining
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python -m src.pipelines.retrain_pipeline $FORCE_FLAG

      - name: Upload drift + retraining reports
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: reports/drift/
